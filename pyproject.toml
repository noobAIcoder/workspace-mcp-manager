[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-mcp-manager"
version = "0.2.0"
description = "Deterministic host-level lifecycle manager for coding-tools-mcp and tunnel-client instances"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "workspace-mcp-manager contributors"}]
dependencies = []

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.scripts]
workspace-mcp-manager = "workspace_mcp_manager.cli:main"
workspace-mcp-manager-tui = "workspace_mcp_manager.tui:main"
workspace-mcp-reboot = "workspace_mcp_manager.reboot:reboot_bridge_main"

[tool.setuptools.packages.find]
where = ["src"]

